<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UtilityCraft Calculator & Resource Tree</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darker: '#0b1120',
                        dark: '#111827',
                        card: '#1e293b',
                        accent: '#38bdf8',
                        accentDark: '#0284c7'
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Vector Icons Library -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b1120; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        button.cat-btn.active {
            background: #38bdf8;
            color: #0b1120;
            font-weight: 600;
        }
        button.tab-btn.active {
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
        }
    </style>
</head>
<body class="bg-darker text-slate-100 min-h-screen flex flex-col font-sans selection:bg-sky-500 selection:text-darker">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-dark/80 backdrop-blur sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center text-slate-950 shadow-lg shadow-sky-500/20">
                    <i data-lucide="box" class="w-6 h-6 stroke-[2.5]"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-xl font-bold tracking-tight text-white">UtilityCraft</h1>
                        <span class="text-xs font-semibold px-2 py-0.5 bg-sky-500/10 text-sky-400 rounded-md border border-sky-500/20">v2.4</span>
                    </div>
                    <p class="text-xs text-slate-400">Minecraft Crafting & Resource Tree Calculator</p>
                </div>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="relative flex-1 md:w-80">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                        <i data-lucide="search" class="w-4 h-4"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Search items, recipes, materials..." class="w-full pl-9 pr-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-sky-500 transition">
                </div>
            </div>
        </div>
    </header>

    <!-- Main App Layout -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8 w-full">
        
        <!-- Left Panel: Catalog -->
        <section class="lg:col-span-7 flex flex-col gap-6">
            <div>
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">Item & Machine Catalog</h2>
                <div class="flex flex-wrap gap-2" id="categoryButtons">
                    <button onclick="filterCategory('all')" class="cat-btn active px-3.5 py-1.5 bg-slate-800 text-slate-200 rounded-lg text-xs font-medium hover:bg-slate-700 transition">All Items</button>
                    <button onclick="filterCategory('basics')" class="cat-btn px-3.5 py-1.5 bg-slate-800 text-slate-200 rounded-lg text-xs font-medium hover:bg-slate-700 transition">Basics & Ores</button>
                    <button onclick="filterCategory('tools')" class="cat-btn px-3.5 py-1.5 bg-slate-800 text-slate-200 rounded-lg text-xs font-medium hover:bg-slate-700 transition">Tools & Paxels</button>
                    <button onclick="filterCategory('components')" class="cat-btn px-3.5 py-1.5 bg-slate-800 text-slate-200 rounded-lg text-xs font-medium hover:bg-slate-700 transition">Steel & Components</button>
                    <button onclick="filterCategory('machines')" class="cat-btn px-3.5 py-1.5 bg-slate-800 text-slate-200 rounded-lg text-xs font-medium hover:bg-slate-700 transition">Machines & Power</button>
                </div>
            </div>

            <!-- Item Cards Container -->
            <div id="itemGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <!-- Dynamically populated by JS -->
            </div>
        </section>

        <!-- Right Panel: Calculator & Multi-Tabbed Breakdown -->
        <section class="lg:col-span-5 flex flex-col gap-6">
            
            <!-- Target Item Control Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-sky-500/5 rounded-full blur-2xl pointer-events-none"></div>
                <div class="flex justify-between items-start mb-4">
                    <div class="flex items-center gap-3">
                        <div id="selectedIconContainer" class="w-10 h-10 rounded-xl bg-sky-500/10 border border-sky-500/20 text-sky-400 flex items-center justify-center">
                            <i data-lucide="layers" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h3 id="selectedItemName" class="text-lg font-bold text-white">Select an item</h3>
                            <p id="selectedItemSub" class="text-xs text-slate-400">Click any item from catalog to select</p>
                        </div>
                    </div>
                    
                    <!-- Quantity Stepper Buttons -->
                    <div class="flex items-center gap-1 bg-slate-950 p-1 border border-slate-800 rounded-xl">
                        <button onclick="adjustQty(-1)" class="w-7 h-7 hover:bg-slate-800 text-slate-300 rounded-lg text-sm font-bold flex items-center justify-center transition">-</button>
                        <input type="number" id="targetQty" value="1" min="1" max="999" onchange="updateQuantity(this.value)" class="w-10 bg-transparent text-center text-sm font-semibold focus:outline-none">
                        <button onclick="adjustQty(1)" class="w-7 h-7 hover:bg-slate-800 text-slate-300 rounded-lg text-sm font-bold flex items-center justify-center transition">+</button>
                        <button onclick="multiplyQty(64)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-lg text-sky-400 transition ml-1" title="Set to 1 Stack">x64</button>
                    </div>
                </div>

                <div id="selectedItemMeta" class="flex flex-wrap gap-2 text-xs text-slate-300 mb-4 empty:hidden">
                    <!-- Station & Energy info inserted here -->
                </div>

                <div class="flex gap-2">
                    <button onclick="openRecipeModal()" id="viewRecipeBtn" disabled class="flex-1 py-2.5 px-4 bg-slate-800 text-slate-500 rounded-xl font-medium text-sm flex items-center justify-center gap-2 transition cursor-not-allowed">
                        <i data-lucide="grid" class="w-4 h-4"></i> View 3x3 Crafting Grid
                    </button>
                </div>
            </div>

            <!-- Multi-Tabbed Breakdown Section (Raw Shopping List, Hierarchy Tree, Required Stations) -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex-1 flex flex-col">
                
                <!-- Tabs Header -->
                <div class="flex border-b border-slate-800 pb-3 mb-4 gap-4 text-xs font-medium text-slate-400">
                    <button onclick="switchTab('shopping')" id="tabBtnShopping" class="tab-btn active pb-1 flex items-center gap-1.5 transition">
                        <i data-lucide="list-checks" class="w-4 h-4"></i> Raw Shopping List
                    </button>
                    <button onclick="switchTab('hierarchy')" id="tabBtnHierarchy" class
